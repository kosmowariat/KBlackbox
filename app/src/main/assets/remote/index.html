<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel zdalny</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #5d6673;
    --accent: #3b6fd4; --accent-text: #ffffff; --border: #d9dde3; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --surface: #1d2127; --text: #e6e9ee; --muted: #9aa3af;
      --accent: #7aa2f7; --accent-text: #10151c; --border: #2d333b; --error: #f2928c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 200px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .muted { color: var(--muted); }
  #status { min-height: 1.4em; margin-top: 8px; }
  #status.error { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Panel zdalny</h1>

  <section>
    <h2>Nowy użytkownik</h2>
    <form id="create-form">
      <input id="name" maxlength="40" placeholder="Nazwa (opcjonalnie)" autocomplete="off">
      <button id="create" type="submit">Dodaj</button>
    </form>
    <div id="status" role="status"></div>
  </section>

  <section>
    <h2>Użytkownicy</h2>
    <ul id="users"></ul>
  </section>
</main>

<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const usersList = document.getElementById('users');
  const statusBox = document.getElementById('status');
  const nameInput = document.getElementById('name');
  const createButton = document.getElementById('create');

  function setStatus(text, isError) {
    statusBox.textContent = text;
    statusBox.className = isError ? 'error' : '';
  }

  async function api(path, options) {
    const response = await fetch(path, { ...options, headers: { 'X-Token': token, 'Content-Type': 'application/json' } });
    const data = await response.json();
    if (!response.ok) throw new Error(response.status === 401 ? 'Brak dostępu, otwórz adres pokazany w telefonie.' : data.error || 'Błąd');
    return data;
  }

  async function loadUsers() {
    try {
      const users = await api('/api/users');
      usersList.replaceChildren(...users.map(user => {
        const item = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = user.name;
        const count = document.createElement('span');
        count.className = 'muted';
        count.textContent = 'Aplikacji: ' + user.appCount;
        item.append(name, count);
        return item;
      }));
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  document.getElementById('create-form').addEventListener('submit', async event => {
    event.preventDefault();
    createButton.disabled = true;
    setStatus('Tworzenie…', false);
    try {
      const user = await api('/api/users', { method: 'POST', body: JSON.stringify({ name: nameInput.value }) });
      nameInput.value = '';
      setStatus('Dodano: ' + user.name, false);
      await loadUsers();
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      createButton.disabled = false;
    }
  });

  loadUsers();
</script>
</body>
</html>
