name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint and unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build APKs and AARs
        run: ./gradlew assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease :black-reflection:assemble :compiler:assemble

      - name: Upload app debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload app release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Bcore AARs
        uses: actions/upload-artifact@v4
        with:
          name: bcore-aars
          path: Bcore/build/outputs/aar/*.aar
          retention-days: 30
          if-no-files-found: error

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: |
            black-reflection/build/libs/*.jar
            compiler/build/libs/*.jar
          retention-days: 30
          if-no-files-found: error
